<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Missão da Rendição · Noite da Rendição dos Filhos</title>
<meta name="description" content="Receba sua missão da Noite da Rendição dos Filhos. Uma atitude prática e uma palavra para viver hoje.">
<meta name="theme-color" content="#050505">
<meta property="og:title" content="Missão da Rendição">
<meta property="og:description" content="Deus tem uma missão para você. Receba a sua.">
<meta property="og:type" content="website">
<meta property="og:image" content="erj-logo.png">
<link rel="icon" type="image/png" href="erj-logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  /* paleta ERJ — preto profundo + verde neon do logo.
     Ajuste os *-rgb para mudar todo o esquema de uma vez. */
  --neon-rgb:165,227,12;      /* verde neon extraído do logo (#A5E30C) */
  --luz-rgb:244,247,238;      /* branco levemente esverdeado */
  --musgo-rgb:42,58,8;        /* verde escuro dos cantos */

  --noite:#050505;
  --noite-2:#0B0E07;
  --painel:#0E1209;
  --neon:rgb(var(--neon-rgb));
  --neon-forte:#C6F53C;
  --luz:rgb(var(--luz-rgb));
  --luz-suave:rgba(var(--luz-rgb),.62);
  --linha:rgba(var(--neon-rgb),.22);

  --display:"Anton",Impact,"Arial Narrow",sans-serif;
  --corpo:"DM Sans",system-ui,sans-serif;
  --etiqueta:"Barlow Condensed",Impact,sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}

body{
  min-height:100svh;
  background:var(--noite);
  background-image:radial-gradient(130% 90% at 50% -10%, var(--noite-2), var(--noite) 62%);
  color:var(--luz);
  font-family:var(--corpo);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:clamp(20px,5vw,48px) clamp(18px,5vw,32px);
  padding-bottom:calc(clamp(20px,5vw,48px) + env(safe-area-inset-bottom));
  overflow-x:hidden;
  position:relative;
}

/* ---------- atmosfera ---------- */
.ceu{position:fixed;inset:0;pointer-events:none;z-index:0}
.ceu::before,.ceu::after{content:"";position:absolute;inset:0}
.ceu::before{
  background:
    radial-gradient(120% 70% at 50% 118%, rgba(var(--neon-rgb),.22), transparent 60%),
    radial-gradient(90% 55% at 50% 108%, rgba(198,245,60,.14), transparent 65%);
  transition:opacity 1.2s ease, transform 1.2s ease;
  opacity:.55;
}
.ceu::after{
  background:
    radial-gradient(80% 50% at 15% -10%, rgba(var(--musgo-rgb),.75), transparent 60%),
    radial-gradient(70% 45% at 95% 5%, rgba(26,32,16,.85), transparent 60%);
}
body.revelado .ceu::before{opacity:1;transform:scale(1.06)}

/* respingos de tinta — textura do cartaz */
.respingos{
  position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55;
  background:
    radial-gradient(2px 2px at 9% 16%, rgba(var(--neon-rgb),.6), transparent 62%),
    radial-gradient(3px 3px at 17% 74%, rgba(var(--neon-rgb),.32), transparent 62%),
    radial-gradient(2px 2px at 26% 34%, rgba(var(--neon-rgb),.45), transparent 62%),
    radial-gradient(1.5px 1.5px at 33% 89%, rgba(var(--neon-rgb),.5), transparent 62%),
    radial-gradient(4px 4px at 44% 8%, rgba(var(--neon-rgb),.22), transparent 62%),
    radial-gradient(2px 2px at 52% 57%, rgba(var(--neon-rgb),.28), transparent 62%),
    radial-gradient(2.5px 2.5px at 61% 23%, rgba(var(--neon-rgb),.4), transparent 62%),
    radial-gradient(1.5px 1.5px at 68% 81%, rgba(var(--neon-rgb),.55), transparent 62%),
    radial-gradient(3px 3px at 77% 45%, rgba(var(--neon-rgb),.3), transparent 62%),
    radial-gradient(2px 2px at 84% 12%, rgba(var(--neon-rgb),.42), transparent 62%),
    radial-gradient(2px 2px at 91% 66%, rgba(var(--neon-rgb),.35), transparent 62%),
    radial-gradient(1.5px 1.5px at 96% 30%, rgba(var(--neon-rgb),.5), transparent 62%),
    radial-gradient(140px 90px at 8% 92%, rgba(var(--musgo-rgb),.5), transparent 70%),
    radial-gradient(160px 110px at 94% 6%, rgba(var(--musgo-rgb),.42), transparent 70%);
}

.brasa{
  position:fixed;bottom:-24px;
  width:4px;height:4px;border-radius:50%;
  background:var(--neon-forte);
  box-shadow:0 0 10px 2px rgba(var(--neon-rgb),.5);
  pointer-events:none;z-index:1;
  animation:subir linear forwards;
}
@keyframes subir{
  0%{transform:translate3d(0,0,0) scale(1);opacity:0}
  12%{opacity:.95}
  100%{transform:translate3d(var(--desvio),-108svh,0) scale(.25);opacity:0}
}

/* ---------- estrutura ---------- */
.palco{
  position:relative;z-index:2;
  width:100%;max-width:640px;
  display:flex;flex-direction:column;align-items:center;
}

.etiqueta{
  font-family:var(--etiqueta);
  font-weight:600;
  font-size:clamp(.78rem,2.9vw,.92rem);
  letter-spacing:.34em;
  text-transform:uppercase;
  color:var(--neon);
}

/* logo ERJ — discreto, centralizado no topo */
.marca-erj{
  position:relative;z-index:2;
  display:block;
  width:clamp(84px,22vw,118px);
  height:auto;
  margin:0 auto clamp(22px,5vw,34px);
  opacity:.72;
  filter:drop-shadow(0 0 18px rgba(var(--neon-rgb),.28));
  transition:opacity .6s ease;
}
body.revelado .marca-erj{opacity:.9}

.marca{
  width:26px;height:26px;margin-bottom:18px;
  color:var(--neon);
  filter:drop-shadow(0 0 14px rgba(var(--neon-rgb),.6));
  animation:respirar 3.4s ease-in-out infinite;
}
@keyframes respirar{
  0%,100%{transform:scale(1);opacity:.85}
  50%{transform:scale(1.14);opacity:1}
}

/* ---------- abertura ---------- */
.abertura{text-align:center;display:flex;flex-direction:column;align-items:center}
.abertura h1{
  font-family:var(--display);
  font-weight:400;                 /* Anton só tem um peso */
  font-size:clamp(3.1rem,14.5vw,5.3rem);
  line-height:.96;                 /* folga para os acentos em caixa alta */
  letter-spacing:.005em;
  text-transform:uppercase;
  margin:22px 0 16px;
}
.abertura p{
  color:var(--luz-suave);
  font-size:clamp(1rem,4vw,1.12rem);
  line-height:1.55;
  max-width:30ch;
  margin-bottom:34px;
}

.chamada{
  font-family:var(--display);
  font-weight:400;
  font-size:clamp(1.9rem,8.4vw,2.9rem);
  line-height:1.12;
  letter-spacing:.005em;
  text-transform:uppercase;
  text-align:center;
  max-width:16ch;
  color:var(--luz);
}

/* ---------- cartão ---------- */
.cartao{
  width:100%;
  background:linear-gradient(168deg,var(--painel),#070A04);
  border:1px solid var(--linha);
  border-radius:24px;
  padding:clamp(26px,6.5vw,40px);
  box-shadow:0 32px 80px rgba(0,0,0,.7), 0 0 0 1px rgba(var(--neon-rgb),.05), inset 0 1px 0 rgba(var(--neon-rgb),.09);
  text-align:left;
}

.selo{
  display:flex;align-items:center;gap:12px;
  padding-bottom:16px;
  border-bottom:1px solid rgba(var(--luz-rgb),.1);
  margin-bottom:22px;
}
.selo span{flex:1}
.selo .ponto{
  width:7px;height:7px;border-radius:50%;
  background:var(--neon);
  box-shadow:0 0 10px 2px rgba(var(--neon-rgb),.65);
  flex:none;
}

.nome{
  font-family:var(--display);
  font-weight:400;
  font-size:clamp(2rem,8.6vw,3.2rem);
  line-height:1.06;
  letter-spacing:.005em;
  color:var(--neon);
  min-height:2.1em;
  display:flex;align-items:center;
}
.nome.brilho{
  background:linear-gradient(100deg,var(--neon) 20%,#FFFFFF 46%,var(--neon) 70%);
  background-size:280% 100%;
  -webkit-background-clip:text;background-clip:text;
  color:transparent;
  animation:varrer 1.1s ease-out 1;
}
@keyframes varrer{from{background-position:170% 0}to{background-position:-40% 0}}

.quem{
  font-family:var(--corpo);
  font-size:clamp(.86rem,3.3vw,.95rem);
  color:rgba(var(--neon-rgb),.72);
  margin-top:10px;
}

.tarefa{
  font-size:clamp(1.06rem,4.3vw,1.22rem);
  line-height:1.6;
  color:var(--luz);
  margin:22px 0 26px;
}

.palavra{
  border-left:2px solid var(--neon);
  background:rgba(var(--neon-rgb),.07);
  border-radius:0 14px 14px 0;
  padding:18px 20px;
}
/* o versículo fica na fonte de corpo: a Anton gritaria aqui */
.palavra q{
  font-family:var(--corpo);
  font-weight:500;
  font-size:clamp(1.02rem,4vw,1.16rem);
  line-height:1.6;
  quotes:"\201C" "\201D";
  display:block;
}
.palavra cite{
  display:block;margin-top:12px;
  font-family:var(--etiqueta);
  font-style:normal;font-weight:600;
  font-size:.9rem;letter-spacing:.22em;text-transform:uppercase;
  color:var(--neon);
}

.envio{
  margin-top:26px;padding-top:20px;
  border-top:1px solid rgba(var(--luz-rgb),.1);
  font-family:var(--display);
  font-weight:400;
  font-size:clamp(1.15rem,4.6vw,1.42rem);
  line-height:1.2;
  letter-spacing:.01em;
  text-transform:uppercase;
}

/* ---------- botões ---------- */
.acoes{display:flex;flex-wrap:wrap;gap:12px;width:100%;margin-top:24px}
.botao{
  flex:1 1 160px;
  font-family:var(--etiqueta);
  font-weight:600;
  font-size:clamp(1rem,3.8vw,1.06rem);
  letter-spacing:.14em;
  text-transform:uppercase;
  padding:16px 22px;
  border-radius:14px;
  border:1px solid transparent;
  cursor:pointer;
  transition:transform .18s ease, background .18s ease, border-color .18s ease;
}
/* na abertura o container é coluna: o flex-basis viraria altura */
.abertura .botao{flex:0 0 auto}
.botao.principal{
  background:linear-gradient(140deg,var(--neon-forte),var(--neon));
  color:#0A1000;
  box-shadow:0 16px 40px rgba(var(--neon-rgb),.26);
}
.botao.calmo{
  background:transparent;color:var(--luz);
  border-color:rgba(var(--luz-rgb),.26);
}
.botao:hover{transform:translateY(-2px)}
.botao.calmo:hover{border-color:var(--neon);color:var(--neon)}
.botao:active{transform:translateY(0) scale(.98)}
.botao:focus-visible{outline:2px solid var(--neon);outline-offset:3px}

.rodape{
  position:relative;z-index:2;
  margin-top:32px;
  font-family:var(--etiqueta);
  font-size:.85rem;letter-spacing:.28em;text-transform:uppercase;
  color:rgba(var(--luz-rgb),.38);
  text-align:center;
}

/* ---------- cenas ---------- */
.cena{display:none;width:100%;flex-direction:column;align-items:center}
.cena.ativa{display:flex;animation:entrar .7s cubic-bezier(.22,1,.36,1) both}
@keyframes entrar{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.saindo{animation:sair .45s ease forwards}
@keyframes sair{to{opacity:0;transform:translateY(-14px)}}

.escalonado > *{animation:subir-suave .6s cubic-bezier(.22,1,.36,1) both}
.escalonado > *:nth-child(2){animation-delay:.08s}
.escalonado > *:nth-child(3){animation-delay:.16s}
.escalonado > *:nth-child(4){animation-delay:.24s}
.escalonado > *:nth-child(5){animation-delay:.32s}
@keyframes subir-suave{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.aviso{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);
  background:var(--neon);color:#0A1000;
  font-family:var(--etiqueta);font-size:.95rem;letter-spacing:.16em;text-transform:uppercase;
  padding:12px 22px;border-radius:999px;
  opacity:0;pointer-events:none;transition:.3s ease;z-index:5;
}
.aviso.visivel{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
  .brasa{display:none}
}
</style>
</head>

<body>

<div class="ceu" aria-hidden="true"></div>
<div class="respingos" aria-hidden="true"></div>

<img class="marca-erj" src="erj-logo.png" alt="ERJ · Explosão Radical Jovem" width="460" height="374">

<main class="palco">

  <!-- CENA 1 -->
  <section class="cena ativa" id="cena-abertura">
    <div class="abertura">
      <div class="etiqueta">Noite da Rendição dos Filhos</div>
      <h1>Você está pronto?</h1>
      <p>Render-se não é só receber. É levantar e ir. Peça a sua missão desta noite.</p>
      <button class="botao principal" id="btn-comecar">Receber minha missão</button>
    </div>
  </section>

  <!-- CENA 2 -->
  <section class="cena" id="cena-chamado">
    <svg class="marca" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M12 1.5c.6 3.4-1.2 4.7-2.6 6.2C7.6 9.6 6 11.3 6 14.3 6 18.4 8.9 22.5 12 22.5s6-4.1 6-8.2c0-2.6-1.2-4.3-2.6-5.9-.5 1.3-1.3 2.1-2.2 2.5.7-2.6.2-6-1.2-9.4z"/>
    </svg>
    <p class="chamada">Deus tem uma missão para você…</p>
  </section>

  <!-- CENA 3 -->
  <section class="cena" id="cena-missao">
    <article class="cartao escalonado" aria-live="polite">
      <div class="selo">
        <i class="ponto" aria-hidden="true"></i>
        <span class="etiqueta">Sua missão</span>
      </div>

      <h2 class="nome" id="nome"></h2>
      <p class="quem" id="quem"></p>
      <p class="tarefa" id="tarefa"></p>

      <blockquote class="palavra">
        <q id="palavra"></q>
        <cite id="referencia"></cite>
      </blockquote>

      <p class="envio">Não guarde essa missão. Viva-a.</p>
    </article>

    <div class="acoes">
      <button class="botao calmo" id="btn-outra">Sortear outra</button>
      <button class="botao principal" id="btn-enviar">Enviar para alguém</button>
    </div>
  </section>

</main>

<p class="rodape">ERJ · Renda-se ao Pai · Viva a missão</p>

<div class="aviso" id="aviso" role="status">Missão copiada</div>

<script>
const missoes = [
  { nome:"MISSÃO ANDRÉ", quem:"André levou o próprio irmão até Jesus — João 1:41",
    texto:"Encontre alguém que ainda não conhece Jesus e ore por essa pessoa hoje, pelo nome." },
  { nome:"MISSÃO FILIPE", quem:"Filipe respondeu à dúvida com um convite: vem e vê — João 1:46",
    texto:"Convide alguém para o próximo culto, célula ou ERJ. Convite feito pessoalmente, não no grupo." },
  { nome:"MISSÃO DOS AMIGOS DO PARALÍTICO", quem:"Quatro amigos abriram o telhado para chegar até Jesus — Marcos 2:4",
    texto:"Procure alguém que está passando por uma dificuldade e mostre, com uma atitude, que você está ao lado dela." },
  { nome:"MISSÃO DA SAMARITANA", quem:"Ela deixou o cântaro e contou à cidade inteira — João 4:28",
    texto:"Conte para alguém um testemunho do que Deus já fez na sua vida. Sem enfeitar, do jeito que aconteceu." },
  { nome:"MISSÃO DO MENINO DOS PÃES", quem:"Ele entregou cinco pães e dois peixes — João 6:9",
    texto:"Entregue a Deus algo que é seu: um talento, um tempo, um recurso ou um sonho. Escolha um e entregue hoje." },
  { nome:"MISSÃO BARNABÉ", quem:"Chamado de filho da consolação — Atos 4:36",
    texto:"Encoraje alguém que está desanimado. Diga o que você vê de bom nessa pessoa." },
  { nome:"MISSÃO DORCAS", quem:"Cheia de boas obras e de esmolas que fazia — Atos 9:36",
    texto:"Faça um serviço concreto por alguém sem contar para ninguém e sem esperar reconhecimento." },
  { nome:"MISSÃO PAULO", quem:"Senhor, que queres que eu faça? — Atos 9:6",
    texto:"Identifique uma área da sua vida que ainda não foi entregue a Deus. Entregue essa área hoje, em oração." }
];

const versiculos = [
  { texto:"Entrega o teu caminho ao Senhor; confia nele, e ele tudo fará.", referencia:"Salmos 37:5" },
  { texto:"Eis-me aqui, envia-me a mim.", referencia:"Isaías 6:8" },
  { texto:"Cada um exerça o dom que recebeu para servir aos outros.", referencia:"1 Pedro 4:10" },
  { texto:"Ide por todo o mundo e pregai o evangelho a toda criatura.", referencia:"Marcos 16:15" },
  { texto:"Aquele que quiser tornar-se grande entre vocês deverá ser servo.", referencia:"Mateus 20:26" },
  { texto:"Tudo quanto fizerdes, fazei-o de todo o coração, como ao Senhor.", referencia:"Colossenses 3:23" },
  { texto:"Não amemos de palavra, nem de língua, mas por obra e em verdade.", referencia:"1 João 3:18" },
  { texto:"E por que me chamais Senhor, Senhor, e não fazeis o que vos digo?", referencia:"Lucas 6:46" }
];

const calmo = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = id => document.getElementById(id);
const cenas = { abertura:$("cena-abertura"), chamado:$("cena-chamado"), missao:$("cena-missao") };
let atual = null;

/* sorteio sem repetir enquanto houver missões novas */
let sacola = [];
let ultima = -1;
function proximoIndice(){
  if(!sacola.length){
    sacola = missoes.map((_,i)=>i);
    for(let i=sacola.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [sacola[i],sacola[j]] = [sacola[j],sacola[i]];
    }
    if(sacola[sacola.length-1] === ultima && sacola.length > 1){
      [sacola[sacola.length-1],sacola[0]] = [sacola[0],sacola[sacola.length-1]];
    }
  }
  ultima = sacola.pop();
  return ultima;
}

function trocarCena(destino){
  Object.values(cenas).forEach(c => c.classList.remove("ativa"));
  destino.classList.add("ativa");
}

/* brasas */
function brasa(vidaBase){
  if(calmo) return;
  const b = document.createElement("div");
  b.className = "brasa";
  const tam = 2 + Math.random()*4;
  b.style.left = Math.random()*100 + "vw";
  b.style.width = b.style.height = tam + "px";
  b.style.opacity = .35 + Math.random()*.55;
  b.style.setProperty("--desvio", (Math.random()*120-60) + "px");
  const vida = vidaBase + Math.random()*4;
  b.style.animationDuration = vida + "s";
  if(Math.random() > .55) b.style.background = "var(--neon)";
  document.body.appendChild(b);
  setTimeout(()=>b.remove(), vida*1000);
}
if(!calmo){
  setInterval(()=>brasa(7), 650);
  for(let i=0;i<6;i++) setTimeout(()=>brasa(7), i*400);
}
function labareda(){
  for(let i=0;i<38;i++) setTimeout(()=>brasa(3.4), i*22);
}

/* roleta */
function girar(missao, aoTerminar){
  const alvo = $("nome");
  if(calmo){ alvo.textContent = missao.nome; aoTerminar(); return; }
  let intervalo = 55, total = 0;
  (function passo(){
    alvo.textContent = missoes[Math.floor(Math.random()*missoes.length)].nome;
    total += intervalo;
    intervalo *= 1.19;
    if(total < 1450){ setTimeout(passo, intervalo); }
    else{
      alvo.textContent = missao.nome;
      alvo.classList.remove("brilho");
      void alvo.offsetWidth;
      alvo.classList.add("brilho");
      aoTerminar();
    }
  })();
}

function revelar(){
  const missao = missoes[proximoIndice()];
  const versiculo = versiculos[Math.floor(Math.random()*versiculos.length)];
  atual = { missao, versiculo };

  const cartao = document.querySelector(".cartao");
  $("quem").style.opacity = $("tarefa").style.opacity = "0";
  document.querySelector(".palavra").style.opacity = "0";
  document.querySelector(".envio").style.opacity = "0";

  trocarCena(cenas.missao);
  cartao.classList.remove("escalonado");

  girar(missao, () => {
    document.body.classList.add("revelado");
    labareda();
    $("quem").textContent = missao.quem;
    $("tarefa").textContent = missao.texto;
    $("palavra").textContent = versiculo.texto;
    $("referencia").textContent = versiculo.referencia;
    [$("quem"), $("tarefa"), document.querySelector(".palavra"), document.querySelector(".envio")]
      .forEach((el,i) => {
        el.style.opacity = "";
        el.style.animation = "none";
        void el.offsetWidth;
        el.style.animation = `subir-suave .55s cubic-bezier(.22,1,.36,1) ${i*.09}s both`;
      });
  });
}

$("btn-comecar").addEventListener("click", () => {
  trocarCena(cenas.chamado);
  labareda();
  setTimeout(revelar, calmo ? 200 : 1800);
});

$("btn-outra").addEventListener("click", revelar);

$("btn-enviar").addEventListener("click", async () => {
  if(!atual) return;
  const texto =
`${atual.missao.nome}

${atual.missao.texto}

“${atual.versiculo.texto}”
${atual.versiculo.referencia}
