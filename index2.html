<!-- Fontes carregadas SEM bloquear a renderização.
     O truque do media="print": o navegador baixa a folha mas não a
     aplica (não é mídia de tela), então não trava o primeiro pixel;
     no onload ela vira "all" e entra. Com display=swap na URL, o texto
     aparece na hora com Impact/system-ui e troca sozinho quando chega.
     Antes disso, o FCP ficava refém do Google Fonts. -->
<link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
      href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@600&family=DM+Sans:wght@400;500&display=swap">
<noscript>
  <link rel="stylesheet"

<style>
:root{

  /* verde histórico do ERJ, medido no logo — nunca muda,
     serve de referência para qualquer esquema que queira usá-lo */
  --erj-rgb:165,227,12;





  --acento-rgb:255,76,44;
  --acento-claro-rgb:255,106,72;
  --apoio-rgb:141,180,201;
  --luz-rgb:244,248,250;
  --musgo-rgb:0,75,107;
  --sombra-rgb:0,18,28;

  --fundo:#00121C;
  --fundo-alto:#00344C;
  --painel:#012C40;
  --painel-2:#001926;
  --tinta:#00121C;

  --brilho:.5;
  --linha:rgba(var(--luz-rgb),.14);
  --rotulo:rgb(var(--acento-rgb));
  --apoio:rgb(var(--apoio-rgb));
  --logo-cor:rgb(var(--erj-rgb));
  /* --logo-cor:rgb(var(--acento-rgb)); */

/* --- derivados: valem para os três esquemas, não mexa --- */
  --acento:rgb(var(--acento-rgb));
  --acento-claro:rgb(var(--acento-claro-rgb));
  --luz:rgb(var(--luz-rgb));
  --luz-suave:rgba(var(--luz-rgb),.62);
  /* assinatura ERJ: sempre o verde da marca. Nos esquemas A e B o
     acento JÁ é esse verde, então não muda nada lá; no C é ele que
     carrega o ERJ para dentro de uma página laranja e petróleo. */
  --assinatura:rgb(var(--erj-rgb));

  --display:"Anton",Impact,"Arial Narrow",sans-serif;
  --corpo:"DM Sans",system-ui,sans-serif;
  --etiqueta:"Barlow Condensed",Impact,sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}

body{
  min-height:100svh;
  background:var(--fundo);
  background-image:radial-gradient(130% 90% at 50% -10%, var(--fundo-alto), var(--fundo) 62%);
  color:var(--luz);
  font-family:var(--corpo);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:clamp(20px,5vw,48px) clamp(18px,5vw,32px);
  padding-bottom:calc(clamp(20px,5vw,48px) + env(safe-area-inset-bottom));
  overflow-x:hidden;
  position:relative;
}

/* ---------- atmosfera ---------- */
.ceu{position:fixed;inset:0;pointer-events:none;z-index:0}
.ceu::before,.ceu::after{content:"";position:absolute;inset:0}
/* --brilho controla a intensidade de TODO o glow de acento da página:
   1 = estourado (esquema A), .5 a .55 = contido (esquemas B e C) */
.ceu::before{
  background:
    radial-gradient(120% 70% at 50% 118%, rgba(var(--acento-rgb),calc(.22 * var(--brilho))), transparent 60%),
    radial-gradient(90% 55% at 50% 108%, rgba(var(--acento-claro-rgb),calc(.14 * var(--brilho))), transparent 65%);
  transition:opacity 1.2s ease, transform 1.2s ease;
  opacity:.55;
  /* respiração lenta do fundo: dá vida constante à página, inclusive
     na abertura, onde antes só havia as brasas. Anima só transform e
     opacity, então roda na GPU e não custa repintura. */
  animation:respirar-fundo 14s ease-in-out infinite;
}
@keyframes respirar-fundo{
  0%,100%{transform:scale(1)   translateY(0)}
  50%    {transform:scale(1.08) translateY(-1.5%)}
}
.ceu::after{
  background:
    radial-gradient(80% 50% at 15% -10%, rgba(var(--musgo-rgb),.75), transparent 60%),
    radial-gradient(70% 45% at 95% 5%, rgba(var(--sombra-rgb),.85), transparent 60%);
}
/* só a opacidade: o transform agora pertence a respirar-fundo, e
   animação vence declaração normal na cascata */
body.revelado .ceu::before{opacity:1}

/* Textura de fundo. Duas famílias somadas:
   1) os vincos de luz na diagonal, que imitam o plástico amassado do
      banner — usam --luz-rgb, então funcionam em qualquer esquema;
   2) os respingos de tinta herdados do cartaz antigo, no acento.
   CUIDADO AO ACRESCENTAR: cada linha aqui é uma camada do tamanho da
   tela e custa um passe de pintura. Eram 19 e caiu para 11 — a olho
   nu não muda nada, porque a camada inteira vive a ~28% de opacidade. */
.respingos{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  opacity:calc(.55 * var(--brilho));
  background:
    linear-gradient(74deg, transparent 18%, rgba(var(--luz-rgb),.05) 19%, transparent 20.5%),
    linear-gradient(-63deg, transparent 55%, rgba(var(--luz-rgb),.045) 56%, transparent 57.5%),
    linear-gradient(-63deg, transparent 78%, rgba(var(--luz-rgb),.03) 79%, transparent 80.5%),
    radial-gradient(2px 2px at 9% 16%, rgba(var(--acento-rgb),.6), transparent 62%),
    radial-gradient(3px 3px at 17% 74%, rgba(var(--acento-rgb),.32), transparent 62%),
    radial-gradient(2px 2px at 44% 34%, rgba(var(--acento-rgb),.45), transparent 62%),
    radial-gradient(1.5px 1.5px at 68% 81%, rgba(var(--acento-rgb),.55), transparent 62%),
    radial-gradient(2.5px 2.5px at 84% 23%, rgba(var(--acento-rgb),.4), transparent 62%),
    radial-gradient(2px 2px at 93% 62%, rgba(var(--acento-rgb),.35), transparent 62%),
    radial-gradient(140px 90px at 8% 92%, rgba(var(--musgo-rgb),.5), transparent 70%),
    radial-gradient(160px 110px at 94% 6%, rgba(var(--musgo-rgb),.42), transparent 70%);
}

.brasa{
  position:fixed;bottom:-24px;
  width:4px;height:4px;border-radius:50%;
  background:var(--acento-claro);
  box-shadow:0 0 10px 2px rgba(var(--acento-rgb),calc(.5 * var(--brilho)));
  pointer-events:none;z-index:1;
  animation:subir linear forwards;
}
@keyframes subir{
  0%{transform:translate3d(0,0,0) scale(1);opacity:0}
  12%{opacity:.95}
  100%{transform:translate3d(var(--desvio),-108svh,0) scale(.25);opacity:0}
}

/* ---------- estrutura ---------- */
.palco{
  position:relative;z-index:2;
  width:100%;max-width:640px;
  display:flex;flex-direction:column;align-items:center;
}

.etiqueta{
  font-family:var(--etiqueta);
  font-weight:600;
  font-size:clamp(.78rem,2.9vw,.92rem);
  letter-spacing:.34em;
  text-transform:uppercase;
  color:var(--rotulo);
}

/* logo ERJ — discreto, centralizado no topo.
   A imagem está embutida em base64 no fim deste <style>, em --logo-erj,
   para a página não depender de arquivo externo. */
.marca-erj{
  position:relative;z-index:2;
  display:block;
  width:clamp(84px,22vw,118px);
  aspect-ratio:360/293;              /* proporção real do PNG embutido */
  background:var(--logo-erj) center/contain no-repeat;
  margin:clamp(30px,6.5vw,44px) auto 0;   /* assina o pé da página */
  opacity:.72;
  filter:drop-shadow(0 0 18px rgba(var(--acento-rgb),calc(.28 * var(--brilho))));
  transition:opacity .6s ease;
}
/* O PNG tem a cor assada dentro (o verde do logo original). Aqui ele é
   usado só como RECORTE (mask) e quem pinta é --logo-cor, então o logo
   acompanha o esquema de cores em vez de ficar preso ao verde.
   A regra fica dentro de @supports: se o navegador não souber mask,
   cai no background acima e mostra o logo verde — feio seria mostrar
   um retângulo colorido sólido. */
@supports ((mask-image:url("")) or (-webkit-mask-image:url(""))){
  .marca-erj{
    background:var(--logo-cor);
    -webkit-mask:var(--logo-erj) center/contain no-repeat;
            mask:var(--logo-erj) center/contain no-repeat;
  }
}
body.revelado .marca-erj{opacity:.9}

.marca{
  width:26px;height:26px;margin-bottom:18px;
  color:var(--acento);
  filter:drop-shadow(0 0 14px rgba(var(--acento-rgb),calc(.6 * var(--brilho))));
  animation:respirar 3.4s ease-in-out infinite;
}
@keyframes respirar{
  0%,100%{transform:scale(1);opacity:.85}
  50%{transform:scale(1.14);opacity:1}
}

/* ---------- abertura ---------- */
.abertura{text-align:center;display:flex;flex-direction:column;align-items:center}
.abertura h1{
  font-family:var(--display);
  font-weight:400;                 /* Anton só tem um peso */
  font-size:clamp(3.1rem,14.5vw,5.3rem);
  line-height:.96;                 /* folga para os acentos em caixa alta */
  letter-spacing:.005em;
  text-transform:uppercase;
  margin:22px 0 16px;
}
.abertura p{
  color:var(--luz-suave);
  font-size:clamp(1rem,4vw,1.12rem);
  line-height:1.55;
  max-width:30ch;
  margin-bottom:34px;
}

.chamada{
  font-family:var(--display);
  font-weight:400;
  font-size:clamp(1.9rem,8.4vw,2.9rem);
  line-height:1.12;
  letter-spacing:.005em;
  text-transform:uppercase;
  text-align:center;
  max-width:16ch;
  color:var(--luz);
}

/* ---------- cartão ---------- */
.cartao{
  width:100%;
  background:linear-gradient(168deg,var(--painel),var(--painel-2));
  border:1px solid var(--linha);
  border-radius:24px;
  padding:clamp(26px,6.5vw,40px);
  box-shadow:
    0 32px 80px rgba(0,0,0,.7),
    0 0 0 1px rgba(var(--acento-rgb),calc(.05 * var(--brilho))),
    inset 0 1px 0 rgba(var(--luz-rgb),.06);
  text-align:left;
}

.selo{
  display:flex;align-items:center;gap:12px;
  padding-bottom:16px;
  border-bottom:1px solid rgba(var(--luz-rgb),.1);
  margin-bottom:22px;
}
.selo span{flex:1}
.selo .ponto{
  width:7px;height:7px;border-radius:50%;
  background:var(--acento);
  box-shadow:0 0 10px 2px rgba(var(--acento-rgb),calc(.65 * var(--brilho)));
  flex:none;
}

.nome{
  font-family:var(--display);
  font-weight:400;
  font-size:clamp(2rem,8.6vw,3.2rem);
  line-height:1.06;
  letter-spacing:.005em;
  color:var(--acento);
  min-height:2.1em;
  display:flex;align-items:center;
}
.nome.brilho{
  background:linear-gradient(100deg,var(--acento) 20%,var(--luz) 46%,var(--acento) 70%);
  background-size:280% 100%;
  -webkit-background-clip:text;background-clip:text;
  color:transparent;
  animation:varrer 1.1s ease-out 1;
}
@keyframes varrer{from{background-position:170% 0}to{background-position:-40% 0}}

.quem{
  font-family:var(--corpo);
  font-size:clamp(.86rem,3.3vw,.95rem);
  color:var(--apoio);
  margin-top:10px;
}

.tarefa{
  font-size:clamp(1.06rem,4.3vw,1.22rem);
  line-height:1.6;
  color:var(--luz);
  margin:22px 0 26px;
}

/* zona da assinatura ERJ: barra e referência no verde da marca.
   O fundo é um véu branco, não verde — sobre o petróleo do esquema C
   um véu verde embarrava e puxava a cor para oliva. */
.palavra{
  border-left:2px solid var(--assinatura);
  background:rgba(var(--luz-rgb),.05);
  border-radius:0 14px 14px 0;
  padding:18px 20px;
}
/* o versículo fica na fonte de corpo: a Anton gritaria aqui */
.palavra q{
  font-family:var(--corpo);
  font-weight:500;
  font-size:clamp(1.02rem,4vw,1.16rem);
  line-height:1.6;
  quotes:"\201C" "\201D";
  display:block;
}
.palavra cite{
  display:block;margin-top:12px;
  font-family:var(--etiqueta);
  font-style:normal;font-weight:600;
  font-size:.9rem;letter-spacing:.22em;text-transform:uppercase;
  color:var(--assinatura);
}

.envio{
  margin-top:26px;padding-top:20px;
  border-top:1px solid rgba(var(--luz-rgb),.1);
  font-family:var(--display);
  font-weight:400;
  font-size:clamp(1.15rem,4.6vw,1.42rem);
  line-height:1.2;
  letter-spacing:.01em;
  text-transform:uppercase;
}

/* ---------- botões ---------- */
.acoes{display:flex;flex-wrap:wrap;gap:12px;width:100%;margin-top:24px}
.botao{
  flex:1 1 160px;
  /* inline-flex + text-decoration:none porque "Enviar no WhatsApp" é
     uma âncora, não um <button> — veja o comentário no HTML */
  display:inline-flex;align-items:center;justify-content:center;
  text-align:center;text-decoration:none;
  font-family:var(--etiqueta);
  font-weight:600;
  font-size:clamp(1rem,3.8vw,1.06rem);
  letter-spacing:.14em;
  text-transform:uppercase;
  padding:16px 22px;
  border-radius:14px;
  border:1px solid transparent;
  cursor:pointer;
  transition:transform .18s ease, background .18s ease, border-color .18s ease;
}
/* na abertura o container é coluna: o flex-basis viraria altura */
.abertura .botao{flex:0 0 auto}
/* "Enviar no WhatsApp" é bem mais longo que "Sortear outra": sem isso
   ele quebra em duas linhas e deixa a dupla desalinhada */
.acoes .botao.principal{flex:1.45 1 190px}
.botao.principal{
  background:linear-gradient(140deg,var(--acento-claro),var(--acento));
  color:var(--tinta);
  box-shadow:0 16px 40px rgba(var(--acento-rgb),calc(.26 * var(--brilho)));
}
.botao.calmo{
  background:transparent;color:var(--luz);
  border-color:rgba(var(--luz-rgb),.26);
}
.botao:hover{transform:translateY(-2px)}
.botao.calmo:hover{border-color:var(--acento);color:var(--acento)}
.botao:active{transform:translateY(0) scale(.98)}
.botao:focus-visible{outline:2px solid var(--acento);outline-offset:3px}

/* ação terciária: existe para quem não usa WhatsApp, sem roubar
   atenção do botão principal */
.botao-texto{
  margin-top:14px;
  background:none;border:none;cursor:pointer;
  font-family:var(--corpo);
  font-size:.88rem;
  color:var(--luz-suave);
  text-decoration:underline;
  text-underline-offset:4px;
  padding:6px 10px;
  transition:color .18s ease;
}
.botao-texto:hover{color:var(--acento)}
.botao-texto:focus-visible{outline:2px solid var(--acento);outline-offset:3px;border-radius:8px}

.rodape{
  position:relative;z-index:2;
  margin-top:16px;                   /* o logo já entrou acima */
  font-family:var(--etiqueta);
  font-weight:600;                   /* explícito: só o 600 é baixado */
  font-size:.85rem;letter-spacing:.28em;text-transform:uppercase;
  color:rgba(var(--luz-rgb),.38);
  text-align:center;
}

/* ---------- cenas ---------- */
.cena{display:none;width:100%;flex-direction:column;align-items:center}
.cena.ativa{display:flex;animation:entrar .7s cubic-bezier(.22,1,.36,1) both}
@keyframes entrar{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.saindo{animation:sair .45s ease forwards}
@keyframes sair{to{opacity:0;transform:translateY(-14px)}}

.escalonado > *{animation:subir-suave .6s cubic-bezier(.22,1,.36,1) both}
.escalonado > *:nth-child(2){animation-delay:.08s}
.escalonado > *:nth-child(3){animation-delay:.16s}
.escalonado > *:nth-child(4){animation-delay:.24s}
.escalonado > *:nth-child(5){animation-delay:.32s}
@keyframes subir-suave{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.aviso{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);
  background:var(--acento);color:var(--tinta);
  font-family:var(--etiqueta);font-weight:600;
  font-size:.95rem;letter-spacing:.16em;text-transform:uppercase;
  padding:12px 22px;border-radius:999px;
  opacity:0;pointer-events:none;transition:.3s ease;z-index:5;
}
.aviso.visivel{opacity:1;transform:translate(-50%,0)}

/* Se o celular estiver com "Reduzir movimento" ligado (Ajustes >
   Acessibilidade no iPhone, Acessibilidade no Android), TUDO abaixo
   entra em vigor e a página fica praticamente parada — é a explicação
   mais comum para "não tem animação nenhuma" num aparelho só.
   O que incomoda nessa preferência é deslocamento, não desvanecimento,
   então mantemos a entrada das cenas como fade puro. */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
  .brasa{display:none}
  .cena.ativa{animation:aparecer .4s ease both !important}
}
@keyframes aparecer{from{opacity:0}to{opacity:1}}

  { nome:"MISSÃO DOS AMIGOS DO PARALÍTICO", quem:"Quatro amigos abriram o telhado para chegar até Jesus — Marcos 2:4",
    texto:"Procure alguém que está passando por uma dificuldade e mostre, com uma atitude, que você está ao lado dela." },
  { nome:"MISSÃO DA SAMARITANA", quem:"Ela deixou o cântaro e contou à cidade inteira — João 4:28",
    texto:"Conte para alguém um testemunho do que Deus já fez na sua vida. Sem enfeitar, do jeito que aconteceu." },
  { nome:"MISSÃO DO MENINO DOS PÃES", quem:"Ele entregou cinco pães e dois peixes — João 6:9",
    texto:"Entregue a Deus algo que é seu: um talento, um tempo, um recurso ou um sonho. Escolha um e entregue hoje." },
  { nome:"MISSÃO BARNABÉ", quem:"Chamado de filho da consolação — Atos 4:36",
    texto:"Encoraje alguém que está desanimado. Diga o que você vê de bom nessa pessoa." },
  { nome:"MISSÃO DORCAS", quem:"Cheia de boas obras e de esmolas que fazia — Atos 9:36",
    texto:"Faça um serviço concreto por alguém sem contar para ninguém e sem esperar reconhecimento." },
  { nome:"MISSÃO PAULO", quem:"Senhor, que queres que eu faça? — Atos 9:6",
    texto:"Identifique uma área da sua vida que ainda não foi entregue a Deus. Entregue essa área hoje, em oração." }
];

const versiculos = [
  { texto:"Entrega o teu caminho ao Senhor; confia nele, e ele tudo fará.", referencia:"Salmos 37:5" },
  { texto:"Eis-me aqui, envia-me a mim.", referencia:"Isaías 6:8" },
  { texto:"Cada um exerça o dom que recebeu para servir aos outros.", referencia:"1 Pedro 4:10" },
  { texto:"Ide por todo o mundo e pregai o evangelho a toda criatura.", referencia:"Marcos 16:15" },
  { texto:"Aquele que quiser tornar-se grande entre vocês deverá ser servo.", referencia:"Mateus 20:26" },
  { texto:"Tudo quanto fizerdes, fazei-o de todo o coração, como ao Senhor.", referencia:"Colossenses 3:23" },
  { texto:"Não amemos de palavra, nem de língua, mas por obra e em verdade.", referencia:"1 João 3:18" },
  { texto:"E por que me chamais Senhor, Senhor, e não fazeis o que vos digo?", referencia:"Lucas 6:46" }
];

const calmo = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = id => document.getElementById(id);
const cenas = { abertura:$("cena-abertura"), chamado:$("cena-chamado"), missao:$("cena-missao") };
let atual = null;

/* sorteio sem repetir enquanto houver missões novas */
let sacola = [];
let ultima = -1;
function proximoIndice(){
  if(!sacola.length){
    sacola = missoes.map((_,i)=>i);
    for(let i=sacola.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [sacola[i],sacola[j]] = [sacola[j],sacola[i]];
    }
    if(sacola[sacola.length-1] === ultima && sacola.length > 1){
      [sacola[sacola.length-1],sacola[0]] = [sacola[0],sacola[sacola.length-1]];
    }
  }
  ultima = sacola.pop();
  return ultima;
}

function trocarCena(destino){
  Object.values(cenas).forEach(c => c.classList.remove("ativa"));
  destino.classList.add("ativa");
}

/* brasas */
function brasa(vidaBase){
  if(calmo || document.hidden) return;
  if(document.getElementsByClassName("brasa").length >= TETO_BRASAS) return;
  const b = document.createElement("div");
  b.className = "brasa";
  const tam = 2 + Math.random()*4;
  b.style.left = Math.random()*100 + "vw";
  b.style.width = b.style.height = tam + "px";
  b.style.opacity = .35 + Math.random()*.55;
  b.style.setProperty("--desvio", (Math.random()*120-60) + "px");
  const vida = vidaBase + Math.random()*4;
  b.style.animationDuration = vida + "s";
  if(Math.random() > .55) b.style.background = "var(--acento)";
  document.body.appendChild(b);
  setTimeout(()=>b.remove(), vida*1000);
}
/* As brasas custam caro: cada uma é um elemento fixo com box-shadow,
   ou seja, uma camada que o navegador compõe por quadro. Três freios:
   1) só começam DEPOIS do load, para não disputar o primeiro paint;
   2) pausam quando a aba sai de foco (antes rodavam para sempre,
      gastando bateria com ninguém olhando);
   3) o teto de brasas vivas é fixo, então rajada nenhuma explode. */
const TETO_BRASAS = 34;
let relogioBrasas = null;

function iniciarBrasas(){
  if(calmo || relogioBrasas) return;
  relogioBrasas = setInterval(()=>brasa(7), 620);
}
function pararBrasas(){
  clearInterval(relogioBrasas);
  relogioBrasas = null;
}

if(!calmo){
  addEventListener("load", () => {
    iniciarBrasas();
    for(let i=0;i<8;i++) setTimeout(()=>brasa(7), i*260);
  });
  document.addEventListener("visibilitychange", () => {
    document.hidden ? pararBrasas() : iniciarBrasas();
  });
}
function labareda(){
  for(let i=0;i<32;i++) setTimeout(()=>brasa(3.4), i*26);
}

/* roleta */
function girar(missao, aoTerminar, instantaneo){
  const alvo = $("nome");
  if(calmo || instantaneo){ alvo.textContent = missao.nome; aoTerminar(); return; }
  let intervalo = 55, total = 0;
  (function passo(){
    alvo.textContent = missoes[Math.floor(Math.random()*missoes.length)].nome;
    total += intervalo;
    intervalo *= 1.19;
    if(total < 1450){ setTimeout(passo, intervalo); }
    else{
      alvo.textContent = missao.nome;
      alvo.classList.remove("brilho");
      void alvo.offsetWidth;
      alvo.classList.add("brilho");
      aoTerminar();
    }
  })();
}

/* indiceForcado só é aceito se for inteiro de verdade. Isso importa
   porque btn-outra chama revelar direto num addEventListener, e sem
   essa checagem o MouseEvent entraria como argumento. */
function revelar(indiceForcado){
  const escolhido = Number.isInteger(indiceForcado) ? indiceForcado : proximoIndice();
  const missao = missoes[escolhido];
  const versiculo = versiculos[Math.floor(Math.random()*versiculos.length)];
  atual = { missao, versiculo };
  /* o link do WhatsApp é montado agora, não no clique: âncora precisa
     do href pronto para o sistema entregar ao app */
  $("btn-enviar").href = "https://wa.me/?text=" + encodeURIComponent(textoDaMissao());

  const cartao = document.querySelector(".cartao");
  $("quem").style.opacity = $("tarefa").style.opacity = "0";
  document.querySelector(".palavra").style.opacity = "0";
  document.querySelector(".envio").style.opacity = "0";

  trocarCena(cenas.missao);
  cartao.classList.remove("escalonado");

  girar(missao, () => {
    document.body.classList.add("revelado");
    labareda();
    /* se o usuário sorteou de novo, o #m= antigo deixa de valer */
    if(!Number.isInteger(indiceForcado)) history.replaceState(null, "", location.pathname);
    $("quem").textContent = missao.quem;
    $("tarefa").textContent = missao.texto;
    $("palavra").textContent = versiculo.texto;
    $("referencia").textContent = versiculo.referencia;
    [$("quem"), $("tarefa"), document.querySelector(".palavra"), document.querySelector(".envio")]
      .forEach((el,i) => {
        el.style.opacity = "";
        el.style.animation = "none";
        void el.offsetWidth;
        el.style.animation = `subir-suave .55s cubic-bezier(.22,1,.36,1) ${i*.09}s both`;
      });
  }, Number.isInteger(indiceForcado));   /* link direto pula a roleta */
}

$("btn-comecar").addEventListener("click", () => {
  trocarCena(cenas.chamado);
  labareda();
  setTimeout(revelar, calmo ? 200 : 1800);
});

$("btn-outra").addEventListener("click", () => revelar());

/* Endereço público da página. É ele que viaja junto da mensagem e faz
   a corrente andar: quem recebe consegue sortear a PRÓPRIA missão em
   vez de só ler a dos outros. Se mudar de domínio, troque aqui e nas
   meta og: lá no <head>.
   ORDEM IMPORTA: isto precisa estar declarado ANTES de qualquer chamada
   a revelar(), porque revelar() já monta o link do WhatsApp. Se ficasse
   depois, o link direto #m= estouraria um ReferenceError. */
const ENDERECO = "https://elilopes83e.github.io/";

function textoDaMissao(){
  if(!atual) return "";
  return `${atual.missao.nome}

${atual.missao.texto}

“${atual.versiculo.texto}”
${atual.versiculo.referencia}

Não guarde essa missão. Viva-a.

Receba a sua missão: ${ENDERECO}
Noite da Rendição dos Filhos · ERJ`;
}

function avisar(mensagem){
  const aviso = $("aviso");
  aviso.textContent = mensagem;
  aviso.classList.add("visivel");
  setTimeout(()=>aviso.classList.remove("visivel"), 2200);
}

$("btn-copiar").addEventListener("click", async () => {
  if(!atual) return;
  const texto = textoDaMissao();
  try{
    await navigator.clipboard.writeText(texto);
    avisar("Missão copiada");
  }catch(e){
    /* clipboard exige HTTPS e permissão; o prompt sempre funciona */
    window.prompt("Copie sua missão:", texto);
  }
});

/* LINK DIRETO PARA UMA MISSÃO:  https://elilopes83e.github.io/#m=2
   Abre já no cartão daquela missão, sem roleta. Serve para o líder
   projetar uma missão específica, ou para alguém mostrar exatamente
   a que tirou. O índice é a posição na lista "missoes", começando
   do zero — #m=0 é a MISSÃO ANDRÉ.
   Repare que o link enviado no WhatsApp NÃO leva #m=: é de propósito,
   para quem recebe sortear a própria missão em vez de repetir a sua.
   Fica no FIM do script porque revelar() depende de tudo acima. */
function missaoDaURL(){
  const achado = /^#m=(\d+)$/.exec(location.hash);
  if(!achado) return -1;
  const i = parseInt(achado[1], 10);
  return (i >= 0 && i < missoes.length) ? i : -1;
}

const missaoInicial = missaoDaURL();
if(missaoInicial >= 0) revelar(missaoInicial);
</script>
